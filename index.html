<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Vanguard AR</title>

  <!-- A-Frame + MindAR (image tracking) -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, Helvetica, Arial, sans-serif;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 999;
      text-align: center;
      padding: 24px;
    }
    #loading-overlay.hidden { display: none; }
    #loading-overlay h1 { font-size: 20px; margin-bottom: 8px; }
    #loading-overlay p { font-size: 14px; opacity: 0.7; max-width: 320px; }
    #hint {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      z-index: 50;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <h1>Loading Vanguard AR...</h1>
    <p>Point your camera at one of your cards once loading finishes. Tap the character to attack.</p>
  </div>

  <div id="hint">Point camera at a card &middot; Tap the character to attack</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets>
      <a-asset-item id="blasterblade-model" src="./models/BlasterBlade.glb"></a-asset-item>
      <a-asset-item id="flogal-model" src="./models/Flogal.glb"></a-asset-item>
      <a-asset-item id="barcgal-model" src="./models/Barcgal.glb"></a-asset-item>
      <a-asset-item id="knightkay-model" src="./models/KnightKay.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- TARGET 0: Blaster Blade (real animated model, plays Basic_Jump on tap) -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity
        id="blasterblade"
        gltf-model="#blasterblade-model"
        scale="0.3 0.3 0.3"
        position="0 0 0.2"
        rotation="0 0 0"
        animation-mixer="clip: Basic_Jump; loop: once; clampWhenFinished: true; timeScale: 1.3"
        class="attackable"
        data-mode="animation"
      ></a-entity>
    </a-entity>

    <!-- TARGET 1: Flogal (real model, no animation - bump-lunge on tap) -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-entity
        id="flogal"
        gltf-model="#flogal-model"
        scale="0.3 0.3 0.3"
        position="0 0 0.2"
        rotation="0 0 0"
        class="attackable"
        data-mode="bump"
      ></a-entity>
    </a-entity>

    <!-- TARGET 2: Barcgal (real model, no animation - bump-lunge on tap) -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-entity
        id="barcgal"
        gltf-model="#barcgal-model"
        scale="0.3 0.3 0.3"
        position="0 0 0.2"
        rotation="0 0 0"
        class="attackable"
        data-mode="bump"
      ></a-entity>
    </a-entity>

    <!-- TARGET 3: Knight Kay (real model, no animation - bump-lunge on tap) -->
    <a-entity mindar-image-target="targetIndex: 3">
      <a-entity
        id="knightkay"
        gltf-model="#knightkay-model"
        scale="0.3 0.3 0.3"
        position="0 0 0.2"
        rotation="0 0 0"
        class="attackable"
        data-mode="bump"
      ></a-entity>
    </a-entity>

  </a-scene>

  <script>
    // Hide the loading overlay once MindAR + A-Frame scene is ready
    const sceneEl = document.querySelector('a-scene');
    sceneEl.addEventListener('renderstart', () => {
      document.getElementById('loading-overlay').classList.add('hidden');
    });

    // ---- Attack logic ----
    // Blaster Blade: play the real "Basic_Jump" animation clip (used as the attack anim)
    // Flogal / Barcgal / Knight Kay: simple Pokemon-style "bump forward and back" using A-Frame's built-in animation component

    function triggerBlasterBladeAttack() {
      const el = document.getElementById('blasterblade');
      if (!el) return;
      // restart the clip from frame 0 each tap
      el.setAttribute('animation-mixer', 'clip: Basic_Jump; loop: once; clampWhenFinished: true; timeScale: 1.3');
      const mixer = el.components['animation-mixer'];
      if (mixer && mixer.mixer) {
        mixer.mixer.stopAllAction();
        Object.values(mixer.actions || {}).forEach(a => { a.reset(); a.play(); });
      }
    }

    function triggerBumpAttack(elId) {
      const el = document.getElementById(elId);
      if (!el) return;
      const startPos = el.getAttribute('position');
      const bumpDistance = 0.12; // how far it lunges forward, in scene units

      // remove any existing animation before starting a new one
      el.removeAttribute('animation__bump');

      el.setAttribute('animation__bump', {
        property: 'position',
        from: `${startPos.x} ${startPos.y} ${startPos.z}`,
        to: `${startPos.x} ${startPos.y} ${startPos.z - bumpDistance}`,
        dur: 120,
        easing: 'easeOutQuad',
        dir: 'alternate',
        loop: 1
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.attackable').forEach(el => {
        el.addEventListener('click', () => {
          const mode = el.getAttribute('data-mode');
          if (mode === 'animation') {
            triggerBlasterBladeAttack();
          } else {
            triggerBumpAttack(el.id);
          }
        });
      });
    });

    // A-Frame needs raycasting enabled on the camera/cursor to detect taps on 3D entities.
    // We add a simple cursor that raycasts on click, since we don't have a visible cursor UI.
    window.addEventListener('load', () => {
      const camera = document.querySelector('a-camera');
      camera.setAttribute('raycaster', 'objects: .attackable');
      camera.setAttribute('cursor', 'rayOrigin: mouse; fuse: false');
    });
  </script>

</body>
</html>
