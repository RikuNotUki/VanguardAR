<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Vanguard AR</title>

    <script src="./lib/aframe.min.js"></script>
    <script src="./lib/mindar-image-aframe.prod.js"></script>

    <style>
      html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, Helvetica, Arial, sans-serif;
      }
      /*
        IMPORTANT: body must NOT have a background.
        MindAR injects its camera <video> into <body> at z-index:-2. Since <body>
        is not a positioned element, its own background paints *after* negative
        z-index descendants, so any background here hides the camera feed.
        This was the black screen.
      */
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }
      a-scene, a-scene canvas { background: transparent !important; }

      #loading-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 999;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #loading-overlay.hidden { display: none; }
      #loading-overlay h1 { font-size: 20px; margin: 0 0 8px; }
      #loading-overlay p { font-size: 14px; opacity: 0.7; max-width: 320px; margin: 0 0 16px; }
      #status {
        font-size: 12px;
        opacity: 0.55;
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      #errorbox {
        display: none;
        margin-top: 18px;
        padding: 12px 14px;
        border: 1px solid #a33;
        background: rgba(170,40,40,0.15);
        color: #ffb3b3;
        font-size: 13px;
        max-width: 320px;
        text-align: left;
        border-radius: 6px;
        line-height: 1.45;
      }

      /* ---- Card stats HUD ---- */
      #hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 100;
        padding: 10px 10px 16px;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        pointer-events: none;
        box-sizing: border-box;
      }
      .card-panel {
        flex: 0 0 auto;
        min-width: 170px;
        background: rgba(8,10,20,0.82);
        border: 1px solid rgba(255,255,255,0.18);
        border-left: 4px solid #6cf;
        border-radius: 8px;
        padding: 9px 11px;
        color: #fff;
      }
      .card-panel .cp-name {
        font-size: 13px;
        font-weight: 700;
        line-height: 1.25;
      }
      .card-panel .cp-sub {
        font-size: 10px;
        opacity: 0.6;
        margin-bottom: 7px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .cp-stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        text-align: center;
      }
      .cp-stats div span {
        display: block;
        font-size: 9px;
        opacity: 0.55;
        text-transform: uppercase;
      }
      .cp-stats div b { font-size: 14px; font-weight: 700; }
      .cp-power b  { color: #ff6b6b; }
      .cp-shield b { color: #6cf; }
      .cp-crit b   { color: #ffd166; }

      #scan-hint {
        position: fixed;
        top: 14px;
        left: 0;
        right: 0;
        text-align: center;
        color: #fff;
        font-size: 13px;
        z-index: 90;
        pointer-events: none;
        text-shadow: 0 1px 4px #000;
      }
      #scan-hint.hidden { display: none; }
    </style>
  </head>

  <body>
    <div id="loading-overlay">
      <h1>Loading Vanguard AR...</h1>
      <p>Point your camera at one of your cards. Tap a unit to attack.</p>
      <div id="status">starting&hellip;</div>
      <div id="errorbox"></div>
    </div>

    <div id="scan-hint">Point the camera at a card</div>
    <div id="hud"></div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;
                    autoStart: true;
                    maxTrack: 4;
                    missTolerance: 8;
                    warmupTolerance: 2;
                    filterMinCF: 0.0001;
                    filterBeta: 0.005;
                    uiScanning: no;
                    uiLoading: no;
                    uiError: no;"
      renderer="colorManagement: true; alpha: true; antialias: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity light="type: ambient; intensity: 1.1"></a-entity>
      <a-entity light="type: directional; intensity: 1.3" position="1 2 2"></a-entity>

      <!--
        Each target gets a "stand-up" wrapper rotated +90 on X.
        MindAR's anchor plane lies flat on the card (Z is the card's normal),
        so a Y-up model needs this to stand on the card instead of lying on it.
      -->

      <a-entity mindar-image-target="targetIndex: 0" card-anchor="key: blasterblade">
        <a-entity rotation="90 0 0">
          <a-entity
            id="blasterblade"
            gltf-model="url(./models/BlasterBlade.glb)"
            auto-fit="height: 1.3"
            attack="clip: Basic_Jump; timeScale: 1.3"
            class="attackable"
          ></a-entity>
        </a-entity>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" card-anchor="key: flogal">
        <a-entity rotation="90 0 0">
          <a-entity
            id="flogal"
            gltf-model="url(./models/Flogal.glb)"
            auto-fit="height: 1.0"
            attack
            class="attackable"
          ></a-entity>
        </a-entity>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2" card-anchor="key: barcgal">
        <a-entity rotation="90 0 0">
          <a-entity
            id="barcgal"
            gltf-model="url(./models/Barcgal.glb)"
            auto-fit="height: 1.0"
            attack
            class="attackable"
          ></a-entity>
        </a-entity>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 3" card-anchor="key: knightkay">
        <a-entity rotation="90 0 0">
          <a-entity
            id="knightkay"
            gltf-model="url(./models/KnightKay.glb)"
            auto-fit="height: 1.3"
            attack
            class="attackable"
          ></a-entity>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      (function () {
        var overlay  = document.getElementById('loading-overlay');
        var statusEl = document.getElementById('status');
        var errorEl  = document.getElementById('errorbox');
        var hudEl    = document.getElementById('hud');
        var hintEl   = document.getElementById('scan-hint');
        var sceneEl  = document.querySelector('a-scene');
        var done     = false;

        function setStatus(m) { statusEl.textContent = m; }
        function showError(m) {
          errorEl.style.display = 'block';
          errorEl.innerHTML += m + '<br>';
        }
        function finish() {
          if (done) { return; }
          done = true;
          overlay.classList.add('hidden');
        }

        window.addEventListener('error', function (e) {
          showError('JS error: ' + (e.message || 'unknown'));
        });

        if (typeof AFRAME === 'undefined') {
          setStatus('library load failed');
          showError('<b>A-Frame did not load.</b> Check that lib/aframe.min.js is committed.');
          return;
        }

        var THREE = AFRAME.THREE;

        /* =========================================================
           CARD DATA
           Edit freely. Check the numbers against your own printings —
           I have only filled in the ones I'm reasonably sure of, and
           Knight Kay in particular you should verify.
           ========================================================= */
        var CARDS = {
          blasterblade: {
            name: 'Blaster Blade', clan: 'Royal Paladin',
            grade: 2, power: 9000, shield: 5000, crit: 1
          },
          flogal: {
            name: 'Flogal', clan: 'Royal Paladin',
            grade: 0, power: 4000, shield: 10000, crit: 1
          },
          barcgal: {
            name: 'Barcgal', clan: 'Royal Paladin',
            grade: 0, power: 4000, shield: 10000, crit: 1
          },
          knightkay: {
            name: 'Knight Kay', clan: 'Royal Paladin',
            grade: 1, power: 7000, shield: 5000, crit: 1
          }
        };

        /* =========================================================
           auto-fit — scale the model to a sensible size on the card,
           centre it, and sit its lowest vertex on the card surface.
           Removes all hand-tuned scale guesswork.
           ========================================================= */
        AFRAME.registerComponent('auto-fit', {
          schema: { height: { type: 'number', default: 1.2 } },
          init: function () {
            var self = this;
            this.el.addEventListener('model-loaded', function () {
              var mesh = self.el.getObject3D('mesh');
              if (!mesh) { return; }

              self.el.object3D.scale.set(1, 1, 1);
              self.el.object3D.position.set(0, 0, 0);
              self.el.object3D.updateMatrixWorld(true);

              var box  = new THREE.Box3().setFromObject(mesh);
              var size = box.getSize(new THREE.Vector3());
              var ctr  = box.getCenter(new THREE.Vector3());
              if (!size.y) { return; }

              var s = self.data.height / size.y;
              self.el.object3D.scale.set(s, s, s);
              self.el.object3D.position.set(-ctr.x * s, -box.min.y * s, -ctr.z * s);
            });

            this.el.addEventListener('model-error', function () {
              showError('Model failed to load: ' + self.el.id);
            });
          }
        });

        /* =========================================================
           attack — plays the clip if the model has one, otherwise a
           forward lunge. Also poses the rig at frame 0 on load so it
           does not sit in its T-pose bind position.
           ========================================================= */
        AFRAME.registerComponent('attack', {
          schema: {
            clip:      { type: 'string', default: '' },
            timeScale: { type: 'number', default: 1 },
            bump:      { type: 'number', default: 0.35 }
          },
          init: function () {
            var self = this;
            this.mixer = null;
            this.action = null;

            this.el.addEventListener('model-loaded', function (e) {
              var model = e.detail.model;
              var clips = model.animations || [];
              if (!self.data.clip || !clips.length) { return; }

              var clip = null;
              for (var i = 0; i < clips.length; i++) {
                if (clips[i].name === self.data.clip) { clip = clips[i]; break; }
              }
              if (!clip) { clip = clips[0]; }

              self.mixer  = new THREE.AnimationMixer(model);
              self.action = self.mixer.clipAction(clip);
              self.action.setLoop(THREE.LoopOnce);
              self.action.clampWhenFinished = true;
              self.action.timeScale = self.data.timeScale;

              // Stamp frame 0 onto the skeleton, then hold there.
              // Without this update() the model renders in its T-pose.
              self.action.play();
              self.action.time = 0;
              self.mixer.update(0);
              self.action.paused = true;
            });

            this.el.addEventListener('click', function () { self.trigger(); });
          },

          trigger: function () {
            if (this.action) {
              this.action.reset();
              this.action.paused = false;
              this.action.play();
              return;
            }
            var p = this.el.object3D.position;
            var d = this.data.bump;
            this.el.removeAttribute('animation__bump');
            this.el.setAttribute('animation__bump', {
              property: 'object3D.position.z',
              from: p.z,
              to: p.z + d,
              dur: 130,
              easing: 'easeOutQuad',
              dir: 'alternate',
              loop: 1
            });
          },

          tick: function (t, dt) {
            if (this.mixer) { this.mixer.update(dt / 1000); }
          }
        });

        /* =========================================================
           card-anchor — drives the stats HUD from target found/lost.
           ========================================================= */
        var visible = {};

        function renderHud() {
          var keys = Object.keys(visible).filter(function (k) { return visible[k]; });
          hintEl.classList.toggle('hidden', keys.length > 0);

          hudEl.innerHTML = keys.map(function (k) {
            var c = CARDS[k];
            if (!c) { return ''; }
            return '' +
              '<div class="card-panel">' +
                '<div class="cp-name">' + c.name + '</div>' +
                '<div class="cp-sub">' + c.clan + '</div>' +
                '<div class="cp-stats">' +
                  '<div><span>Gr</span><b>' + c.grade + '</b></div>' +
                  '<div class="cp-power"><span>Pow</span><b>' + (c.power / 1000) + 'k</b></div>' +
                  '<div class="cp-shield"><span>Sh</span><b>' + (c.shield / 1000) + 'k</b></div>' +
                  '<div class="cp-crit"><span>Crit</span><b>' + c.crit + '</b></div>' +
                '</div>' +
              '</div>';
          }).join('');
        }

        AFRAME.registerComponent('card-anchor', {
          schema: { key: { type: 'string' } },
          init: function () {
            var key = this.data.key;
            this.el.addEventListener('targetFound', function () {
              visible[key] = true;
              renderHud();
            });
            this.el.addEventListener('targetLost', function () {
              visible[key] = false;
              renderHud();
            });
          }
        });

        /* ---- lifecycle ---- */
        sceneEl.addEventListener('loaded', function () {
          setStatus('scene ready, requesting camera\u2026');
          var cam = sceneEl.querySelector('a-camera');
          if (cam) {
            cam.setAttribute('raycaster', 'objects: .attackable');
            cam.setAttribute('cursor', 'rayOrigin: mouse; fuse: false');
          }
        });

        sceneEl.addEventListener('arReady', function () {
          setStatus('AR ready');
          finish();
        });

        sceneEl.addEventListener('arError', function () {
          setStatus('AR failed to start');
          showError(
            '<b>Camera could not start.</b><br>' +
            '\u2022 Must be served over https.<br>' +
            '\u2022 Open in Chrome or Safari directly, not inside Discord / Instagram.<br>' +
            '\u2022 Check camera permission for this site.'
          );
        });

        setTimeout(function () {
          if (!done) {
            showError('Still loading after 30 seconds \u2014 reload and allow camera access.');
          }
        }, 30000);
      })();
    </script>
  </body>
</html>
